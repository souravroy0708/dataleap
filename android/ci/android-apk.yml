name: Build DataLeap APK

# Runs when Android or website files change, after every "Unzip upload", and on demand.
# (Commits made by the unzip workflow do not trigger push events, hence workflow_run.)
on:
  push:
    branches: [main]
    paths: ["android/**", "docs/**", ".github/workflows/android-apk.yml"]
  workflow_run:
    workflows: ["Unzip upload"]
    types: [completed]
  workflow_dispatch:

# Needed to publish GitHub Releases
permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version
        run: |
          APP=$(grep -oP 'val appVersion = "\K[^"]+' android/app/build.gradle.kts)
          echo "V=$APP.$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"

      - name: Self-test (reminder and motivation scheduling)
        run: |
          mkdir -p /tmp/st
          javac -d /tmp/st android/app/src/main/java/io/github/souravroy0708/dataleap/SchedulePlan.java \
                         android/app/src/test/java/io/github/souravroy0708/dataleap/SelfTest.java
          java -cp /tmp/st io.github.souravroy0708.dataleap.SelfTest

      - name: Bundle the website into the app
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp -r docs/. "$W/"
          rm -rf "$W/sw.js" "$W/.nojekyll" "$W/download" "$W/course"
          test -f "$W/index.html" && test -f "$W/assets/js/app.js"
          echo "Bundled $(find "$W" -type f | wc -l) web files"

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No DL_KEYSTORE_BASE64 secret. This APK uses a throwaway debug key: it cannot update the app on your phone and no Release is published."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          DL_KEYSTORE_PASSWORD: ${{ secrets.DL_KEYSTORE_PASSWORD }}
          DL_KEY_ALIAS: ${{ secrets.DL_KEY_ALIAS }}
          DL_KEY_PASSWORD: ${{ secrets.DL_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --console=plain

      - name: Privacy gate (fails the build if a permission sneaks in)
        run: |
          set -e
          m=$(find android/app/build/intermediates/merged_manifest -path "*release*" -name AndroidManifest.xml | head -n1)
          echo "Checking: $m"
          [ -f "$m" ] || { echo "::error::Merged release manifest not found"; exit 1; }
          if grep -q 'READ_SMS"\|RECEIVE_SMS"\|SEND_SMS"\|READ_CALL_LOG"\|READ_CONTACTS"\|ACCESS_FINE_LOCATION"\|ACCESS_COARSE_LOCATION"\|RECORD_AUDIO"\|CAMERA"\|AD_ID"'  "$m"; then
            echo "::error::A personal-data permission was found. DataLeap must never read messages, calls, contacts, location, mic, camera or ad id."; exit 1
          fi
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$m" | sed 's/.*name="//; s/"//' | sort
          echo "✓ Only internet (for links), notifications, alarms and boot."

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | head -4

      - name: Name outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/DataLeap-$V.apk"
          cp "out/DataLeap-$V.apk" out/DataLeap.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataLeap-${{ env.V }}
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release (signed builds only)
        if: success() && env.DL_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: DataLeap ${{ env.V }}
          make_latest: true
          files: |
            out/DataLeap.apk
            out/DataLeap-${{ env.V }}.apk
          body: |
            **DataLeap: staff data engineering prep, every day.**
            System design first, DSA second. Reminders, morning motivation and a live timer, all on your phone.
            **Install:** download `DataLeap.apk` and open it. It updates the app in place; your progress stays.
            No account, no analytics. Data stays on the phone.

      - name: Upload build reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/
          retention-days: 7
