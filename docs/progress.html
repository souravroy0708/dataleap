<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress · DataLeap</title>
<meta name="description" content="Time spent on DSA and system design, by day, week and topic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='9' width='7' height='6' rx='1.5' fill='%232a4d8f'/%3E%3Crect x='15' y='9' width='7' height='6' rx='1.5' fill='none' stroke='%232a4d8f' stroke-width='2'/%3E%3Cpath d='M9 12h6' stroke='%232a4d8f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="progress">
<header id="top"></header>
<main class="wrap">
<section>
  <h1>Progress</h1>
  <div class="kpis" id="kpis"></div>
  <div id="split"></div>
</section>
<section aria-labelledby="g-title">
  <h2 id="g-title">Last 16 weeks</h2>
  <div class="gridwrap" id="grid"></div>
</section>
<section aria-labelledby="t-title">
  <h2 id="t-title">By topic</h2>
  <div class="tablewrap" id="topics"></div>
</section>
<section aria-labelledby="s-title">
  <h2 id="s-title">Recent sessions</h2>
  <div class="tablewrap" id="sessions"></div>
</section>
<section class="panel" aria-labelledby="b-title">
  <h2 id="b-title">Back up your data</h2>
  <p class="small">Progress lives only in this browser. Export a backup every week, and import it on another device or browser.</p>
  <div class="actions"><button class="btn primary" id="export">Export backup</button><label class="btn" for="import" style="margin:0">Import backup</label><input id="import" type="file" accept="application/json" hidden></div>
</section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
